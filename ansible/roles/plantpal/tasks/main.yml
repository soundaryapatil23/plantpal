---
- name: Install runtime (Python, venv, pip)
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Copy and extract built artifact
  ansible.builtin.unarchive:
    src: "{{ artifact_path }}"
    dest: "{{ app_dir }}"
    owner: "{{ app_user }}"
    extra_opts: ["--strip-components=1"]
  notify: Restart plantpal   # handler runs only if files actually changed

- name: Install Python dependencies in a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
  notify: Restart plantpal

- name: Install systemd service unit
  ansible.builtin.template:
    src: plantpal.service.j2
    dest: /etc/systemd/system/plantpal.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart plantpal

- name: Flush handlers so the service is configured before starting
  ansible.builtin.meta: flush_handlers

- name: Enable and start plantpal service
  ansible.builtin.systemd:
    name: plantpal
    enabled: true
    state: started

- name: Verify the app responds on /health
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: health
  retries: 5
  delay: 2
  until: health.status == 200
